name: Create Release with DEB Package

on:

  push:

    tags:

      - 'v*'

jobs:

  build-release:

    runs-on: ubuntu-latest

    

    steps:

    - name: Checkout code

      uses: actions/checkout@v4

      

    - name: Configure CMake

      run: cmake -B build -S .

      

    - name: Build project

      run: cmake --build build

      

    - name: Run tests

      run: |

        cd build

        ctest --output-on-failure

      

    - name: Build DEB package

      run: |

        cd build

        cpack -G DEB

        

    - name: Find DEB file

      id: find_deb

      run: |

        DEB_FILE=$(find build -maxdepth 1 -name "*.deb" -type f | head -n 1)

        echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT

        echo "Found DEB package: $DEB_FILE"

      

    - name: Create GitHub Release and upload DEB

      uses: softprops/action-gh-release@v1

      with:

        files: ${{ steps.find_deb.outputs.deb_file }}

        generate_release_notes: true

        name: Release ${{ github.ref_name }}

        tag_name: ${{ github.ref_name }}

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

